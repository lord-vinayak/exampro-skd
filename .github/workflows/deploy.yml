name: Deploy to Hetzner

on:
  push:
    branches:
      - auxcam

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: ~/frappe_docker/deploy.sh
          script_stop: true
          command_timeout: 10m
